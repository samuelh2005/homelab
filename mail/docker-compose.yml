services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    container_name: stalwart
    restart: unless-stopped
    ports:
      # - "443:443"
      # - "8080:8080" -- uses proxy instead
      - "25:25"
      - "587:587"
      - "465:465"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
      - "4190:4190"
    volumes:
      - ./stalwart-etc:/etc/stalwart
      - ./stalwart-data:/var/lib/stalwart
    environment:
      - STALWART_PUBLIC_URL=https://mail-admin.minersonline.uk
networks:
  tunnel_net:
    external: true
