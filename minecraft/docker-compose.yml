services:
  mariadb:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      # Do not create a database, each plugin should create its own database, if needed.
      MYSQL_DATABASE: ""
      MYSQL_USER: ""
      MYSQL_PASSWORD: ""
    volumes:
      - ./mariadb-data:/var/lib/mysql
    ports:
      - '3306:3306'
    secrets:
      - mariadb_root_password
    networks:
      - minecraft
      # DO NOT PUT Traefik here, MariaDB is our database, and Traefik is only for web services. We don't want Traefik to try to route database traffic.

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    labels:
      - traefik.enable=true
      - traefik.http.routers.phpmyadmin.rule=Host(`phpmyadmin.localhost`) || Host(`phpmyadmin.minersonline.uk`)
      - traefik.http.routers.phpmyadmin.entrypoints=websecure
      # Set traefik network. traefik only has access to containers on the traefik network, so we need to tell it to use that network for this container.
      - traefik.docker.network=traefik
      # TLS for wildcard domain
      - traefik.http.routers.phpmyadmin.tls=true
      - traefik.http.routers.phpmyadmin.tls.certresolver=letsencrypt
      - traefik.http.routers.phpmyadmin.tls.domains[0].main=minersonline.uk
      - traefik.http.routers.phpmyadmin.tls.domains[0].sans=*.minersonline.uk
    depends_on:
      - mariadb
    networks:
      - minecraft
      - traefik

  proxy:
    image: itzg/mc-proxy:latest
    restart: unless-stopped
    environment:
      TYPE: "VELOCITY"
      ICON: "https://github.com/miners-online/.github/blob/main/profile/logos/favicon-64x64.png?raw=true"
      PLUGINS_FILE: "/config/plugins.txt"

      CFG_PROXY_SECRET_FILE: "/run/secrets/velocity_forwarding_secret"
      CFG_LUCKPERMS_DB_PASSWORD_FILE: "/run/secrets/luckperms_db_password"
    volumes:
      - ./velocity:/config
    ports:
      - '25565:25565' # Java Edition
      - '25565:25565/udp' # Java Edition query
      - '19132:19132/tcp' # Geyser listener
      - '19132:19132/udp' # Geyser listener
    depends_on:
      - mariadb
    secrets:
      - luckperms_db_password
      - velocity_forwarding_secret
    networks:
      - minecraft
      # DO NOT PUT Traefik here, Velocity is our Minecraft proxy, and Traefik is only for web services. We don't want Traefik to try to route Minecraft traffic.

networks:
  minecraft:
  traefik:
    external: true

secrets:
  mariadb_root_password:
    file: ./secrets/mariadb_root_password_secret.txt
  velocity_forwarding_secret:
    file: ./secrets/velocity_forwarding_secret.txt
  luckperms_db_password:
    file: ./secrets/luckperms_db_password_secret.txt
